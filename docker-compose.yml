version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: travelease_postgres
    restart: always
    environment:
      POSTGRES_DB: travelease_db
      POSTGRES_USER: travelease_user
      POSTGRES_PASSWORD: travelease_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelease_user -d travelease_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: travelease_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-travelease-software-construction-demo-key-2026
      - ALLOWED_HOSTS=localhost,127.0.0.1,web,0.0.0.0
      - DB_ENGINE=postgresql
      - POSTGRES_DB=travelease_db
      - POSTGRES_USER=travelease_user
      - POSTGRES_PASSWORD=travelease_secure_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
