components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        username:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 100
        target_model:
          type: string
          maxLength: 100
        target_id:
          type: string
          maxLength: 100
        details:
          type: string
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
      - target_model
      - username
    BookingTypeEnum:
      enum:
      - PACKAGE
      - HOTEL
      type: string
      description: |-
        * `PACKAGE` - Travel Package
        * `HOTEL` - Hotel Reservation
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        country:
          type: integer
        country_name:
          type: string
          readOnly: true
      required:
      - country
      - country_name
      - id
      - name
    ContactMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        email:
          type: string
